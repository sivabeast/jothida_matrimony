name: jothida_matrimony
description: Jothida Matrimony - Tamil Matrimony App with Horoscope & Porutham Analysis
publish_to: 'none'
version: 1.8.0+12

environment:
  # in_app_purchase_android 0.5.0+ (Play Billing Library 8.0.0) requires
  # Flutter 3.44 / Dart 3.12 — keep .github/workflows/ci.yml in sync.
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  # Localization (English + Tamil)
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.2

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.3
  firebase_messaging: ^15.1.6
  # Foreground heads-up notifications: FCM only draws tray notifications while
  # the app is backgrounded/killed, so FcmService renders foreground pushes
  # itself on the 'high_importance_channel' channel it creates at startup.
  # Requires core-library desugaring — see android/app/build.gradle.
  flutter_local_notifications: ^19.0.0
  # App Check — required because App Check enforcement is ON for this project.
  # Without a provider, Identity Toolkit rejects sign-in with
  # "Firebase App Check token is invalid". See lib/core/config/app_check_config.dart.
  firebase_app_check: ^0.3.1
  google_sign_in: ^6.2.2

  # Cloudinary (profile photo / document uploads — see
  # lib/services/cloudinary/cloudinary_storage_service.dart)
  http: ^1.2.2

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.3.0

  # Payment — Google Play Billing (official Flutter plugin).
  #
  # `in_app_purchase_android` is pinned DIRECTLY (not just pulled in as a
  # transitive dependency) because the Play Billing Library version is decided
  # by that package: 0.5.0 upgraded it from 7.1.1 to **8.0.0**, which is what
  # Google Play requires from 31 Aug 2026. Leaving it transitive let pub keep
  # resolving 0.4.0+3 (Billing 7.x) and Play kept reporting a deprecated
  # Billing Library. Do not relax this floor.
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.0

  # Environment
  flutter_dotenv: ^5.2.1

  # UI
  cached_network_image: ^3.4.1
  # The on-disk cache behind cached_network_image, promoted to a DIRECT
  # dependency because face-centred rendering
  # (lib/core/utils/face_crop_resolver.dart) needs the already-downloaded file
  # to run ML Kit on — reading the cache instead of re-downloading the photo.
  flutter_cache_manager: ^3.4.1
  image_picker: ^1.1.2
  # Pure-Dart image decode/crop/encode — powers the mandatory 1:1 square crop
  # screen (lib/core/utils/image_crop.dart) and the optimized profile-photo
  # export. No native/platform configuration required.
  image: ^4.5.4
  # On-device face detection for the profile photo (§11): the crop screen uses
  # it to centre the square on the member's face before they fine-tune it.
  # Runs entirely on the device (no network, no image ever leaves the phone);
  # when it finds nothing, the screen simply opens in manual-crop mode.
  google_mlkit_face_detection: ^0.14.0
  # Wide range: Flutter 3.27 pins intl 0.19.0, Flutter 3.41 (CI) pins 0.20.2.
  intl: ">=0.19.0 <0.21.0"
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  lottie: ^3.1.3
  pin_code_fields: ^8.0.1
  photo_view: ^0.15.0
  fl_chart: ^0.70.2
  dotted_border: ^2.1.0
  percent_indicator: ^4.2.4
  step_progress_indicator: ^1.0.2
  readmore: ^3.0.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  # ── Reports: professional PDF generation (text/image reports) + in-app
  # PDF viewing (no dependency on an external PDF viewer app) ──
  pdf: ^3.11.1
  printing: ^5.13.4
  # ── Google Play In-App Updates (Immediate flow) ──
  # The ONLY update mechanism: checked on every app open, Play decides whether
  # a newer build exists. There is no admin-managed version gate any more.
  in_app_update: ^4.2.3
  # Running app version — displayed in Settings / About.
  package_info_plus: ^8.1.2
  file_picker: ^8.1.7
  open_file: ^3.5.10
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.1
  # ── Location: "Use My Location" GPS detection + reverse geocoding ──
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  fluttertoast: ^8.2.10
  dropdown_search: ^5.0.6
  # ── Vedic astrology engine (Swiss Ephemeris via FFI) ──
  # Used by AstrologyEngine to compute Rasi / Nakshatra / Lagnam. We use the
  # built-in Moshier mode (SEFLG_MOSEPH) so NO ephemeris data files need to be
  # bundled. Native build — verify on a real device after `flutter pub get`.
  sweph: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4

# ── Branding: ONE logo, one command ───────────────────────────────────────────
# assets/images/app_logo.png is the 1024×1024 master behind EVERYTHING that
# shows the brand mark: the home-screen icon, the Play Store listing icon, the
# splash, login, drawer, app bars and the exported PDFs
# (lib/core/constants/brand_assets.dart → kAppLogoAsset). There is no second
# "report", "launcher" or "store" variant — that is what let two different
# logos ship side by side before.
#
# To apply a NEW logo, one command does all of it:
#   python tool/generate_brand_icons.py path/to/new_logo.png --write-master
#
# It trims the master, rewrites all ten Android icon bitmaps and the Play
# Console 512×512, and prints the plate colour to copy into
# android/app/src/main/res/values/colors.xml → ic_launcher_background.
#
# flutter_launcher_icons is deliberately NOT used: it can only scale the master
# full-bleed, and this artwork fills 85% of its plate, so the zodiac wheel's
# outer stars land under the adaptive-icon mask and get cut off.

flutter:
  uses-material-design: true
  generate: true # enables ARB localization codegen (AppLocalizations)

  assets:
    - assets/images/
    - assets/icons/
    - assets/master_data/
    - assets/master_data/location/
    - assets/master_data/astrology/
    # Bilingual Education / Employment catalogues, generated from
    # lib/core/data/*_catalog.dart by tool/export_master_data.dart. Bundled so
    # they can be seeded into master_data/{key} the same way castes are.
    - assets/master_data/career/
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
        - asset: assets/fonts/NotoSansTamil-Bold.ttf
          weight: 700
