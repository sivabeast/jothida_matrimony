name: Jothida Matrimony CI/CD

on:
  push:
    branches:
      - main
      - develop
      - feat/**
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in sync with the locally installed Flutter SDK (C:\dev\flutter),
          # the `environment:` block in pubspec.yaml and the committed android/
          # scaffolding it generated.
          #
          # 3.44.x is a FLOOR, not a preference: Play Billing Library 8.0.0 ships
          # in in_app_purchase_android 0.5.x, which requires Flutter 3.44 /
          # Dart 3.12. Downgrading this breaks `flutter pub get`.
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # Play Billing 8 / AGP 8.x on Flutter 3.44 build against JDK 17+.
          java-version: '17'

      - name: Create Android platform files (if missing)
        run: |
          if [ ! -d "android/app" ]; then
            flutter create . --platforms=android --org=com.jothida --project-name=jothida_matrimony
          fi

      # Use a fixed, committed debug keystore so every DEBUG build has a STABLE
      # SHA-1. Without this, CI auto-generates a random keystore each run, the
      # SHA-1 changes every build, and Google Sign-In fails with ApiException 10.
      # The matching SHA-1/SHA-256 are listed in FIREBASE_SETUP.md — register
      # them once in the Firebase Console.
      #
      # This keystore is for DEBUG builds only. Release artifacts are signed
      # with the upload key materialised from secrets in the next step; a
      # release build can no longer silently fall back to this key.
      - name: Install fixed debug keystore (stable SHA-1 for Google Sign-In)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      # android/key.properties and android/upload-keystore.jks are git-ignored,
      # so without this step CI has no release credentials at all. That is how
      # the debug-signed AAB that Play rejected was produced: the old Gradle
      # config quietly fell back to the debug key, and the artifact below was
      # published as if it were a release build.
      #
      # Required repository secrets (Settings → Secrets and variables → Actions):
      #   ANDROID_KEYSTORE_BASE64   base64 of android/upload-keystore.jks
      #   ANDROID_KEYSTORE_PASSWORD store password
      #   ANDROID_KEY_ALIAS         key alias (e.g. "upload")
      #   ANDROID_KEY_PASSWORD      key password
      # Create the first one with:
      #   base64 -w0 android/upload-keystore.jks        (Linux/macOS)
      #   [Convert]::ToBase64String([IO.File]::ReadAllBytes("android/upload-keystore.jks"))  (PowerShell)
      - name: Set up release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "## ⚠️ Release artifacts were NOT built — debug fallback used"
              echo ""
              echo "The signing secrets are missing, so this run produced only DEBUG-signed"
              echo "fallback artifacts: \`jothida-matrimony-debug-apk\` and \`jothida-matrimony-debug-aab\`."
              echo "A DEBUG-signed AAB CANNOT be uploaded to Google Play — add the secrets"
              echo "below to also get a release-signed AAB."
              echo ""
              echo "Add these under **Settings → Secrets and variables → Actions**:"
              echo ""
              echo "| Secret | Value |"
              echo "| --- | --- |"
              echo "| \`ANDROID_KEYSTORE_BASE64\` | base64 of \`android/upload-keystore.jks\` |"
              echo "| \`ANDROID_KEYSTORE_PASSWORD\` | \`storePassword\` from \`android/key.properties\` |"
              echo "| \`ANDROID_KEY_PASSWORD\` | \`keyPassword\` from the same file |"
              echo "| \`ANDROID_KEY_ALIAS\` | \`upload\` |"
              echo ""
              echo '```powershell'
              echo '[Convert]::ToBase64String([IO.File]::ReadAllBytes("android/upload-keystore.jks")) | Set-Clipboard'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Debug-signed fallback artifacts (APK + AAB) are still built and
            # uploaded below, so EVERY successful run has both an APK and an AAB
            # to download. Release-signed artifacts are skipped until the upload
            # key is provided via the secrets above (no hard failure on main —
            # the run stays green and always ships the debug fallback pair).
            echo "::warning::Release signing secrets are missing — building DEBUG-signed fallback APK + AAB only. The release (Play-uploadable) AAB was NOT produced; see the job summary for the 4 secrets to add."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Create .env file
        run: |
          cat > .env << EOF
          FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          EOF

      - name: Create google-services.json (optional)
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Run tests
        run: flutter test --coverage
        continue-on-error: true

      - name: Build APK (Debug)
        run: flutter build apk --debug

      # Debug-signed AAB fallback so an App Bundle artifact ALWAYS exists, even
      # when the release signing key is absent. This bundle is NOT uploadable to
      # Google Play — it only guarantees the "both APK and AAB" artifact pair.
      - name: Build AAB (Debug fallback)
        run: flutter build appbundle --debug

      # Release builds run whenever real signing credentials are available, on
      # ANY branch — so a feature branch produces a Play-uploadable bundle
      # without having to merge to main first. (They used to be gated on
      # `github.ref == 'refs/heads/main'` as well, which is why a green feat/**
      # run shipped only the debug APK.)
      #
      # The SIGNING gate is deliberately kept: without the upload key the
      # Gradle guard fails the build on purpose, so skipping here keeps the
      # pipeline green while making it impossible to publish a debug-signed
      # "release" artifact. On main a missing key is still a hard failure
      # (see "Set up release signing" above).
      - name: Build APK (Release)
        if: steps.signing.outputs.available == 'true'
        run: flutter build apk --release

      - name: Build AAB (Release)
        if: steps.signing.outputs.available == 'true'
        run: flutter build appbundle --release

      - name: Verify the AAB is release-signed
        if: steps.signing.outputs.available == 'true'
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile "$AAB" | tee /tmp/cert.txt
          if grep -qi "CN=Android Debug" /tmp/cert.txt; then
            echo "::error::The AAB is signed with a DEBUG certificate — Google Play will reject it."
            exit 1
          fi
          {
            echo "## ✅ Release AAB ready for Google Play"
            echo ""
            echo "Download it from the **jothida-matrimony-release-aab** artifact at the bottom of this page."
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Size | $(du -h "$AAB" | cut -f1) |"
            echo "| Signed by | $(grep -m1 'Owner:' /tmp/cert.txt | sed 's/^ *Owner: //') |"
            echo "| SHA-1 | \`$(grep -m1 'SHA1:' /tmp/cert.txt | sed 's/.*SHA1: //')\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jothida-matrimony-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload debug AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: jothida-matrimony-debug-aab
          path: build/app/outputs/bundle/debug/app-debug.aab

      - name: Upload AAB artifact
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jothida-matrimony-release-aab
          path: build/app/outputs/bundle/release/

      - name: Upload release APK artifact
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jothida-matrimony-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
